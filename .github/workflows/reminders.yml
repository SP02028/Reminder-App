name: Choir Reminder Bot

on:
  schedule:
    # 21:17 UTC ~= 5 PM Eastern (EDT). Off the hour on purpose -- GitHub's own
    # docs warn that :00 is the most congested minute for scheduled runs across
    # all of Actions and gets delayed most. Drifts to 4:17 PM once EST starts
    # in November, since GitHub cron doesn't follow DST -- adjust here if that matters.
    - cron: '17 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reminder bot
        env:
          GROUPME_BOT_ID_OCTAVIATION_WHITE: ${{ secrets.GROUPME_BOT_ID_OCTAVIATION_WHITE }}
          GROUPME_BOT_ID_OCTAVIATION_GREEN: ${{ secrets.GROUPME_BOT_ID_OCTAVIATION_GREEN }}
          GROUPME_BOT_ID_OCTAVIATION_GOLD: ${{ secrets.GROUPME_BOT_ID_OCTAVIATION_GOLD }}
          GROUPME_BOT_ID_SELECT: ${{ secrets.GROUPME_BOT_ID_SELECT }}
          GROUPME_BOT_ID_BELLE_VOCI: ${{ secrets.GROUPME_BOT_ID_BELLE_VOCI }}
          GROUPME_BOT_ID_AVIATOR_CHORALE: ${{ secrets.GROUPME_BOT_ID_AVIATOR_CHORALE }}
          GROUPME_BOT_ID_COPILOTS: ${{ secrets.GROUPME_BOT_ID_COPILOTS }}
          GROUPME_BOT_ID_BOOSTERS: ${{ secrets.GROUPME_BOT_ID_BOOSTERS }}
        run: python main.py

      - name: Persist sent-reminders log
        run: |
          git config user.name "choir-reminder-bot"
          git config user.email "actions@github.com"
          git add storage/sent_reminders.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sent reminders log [skip ci]"
            git push
          fi
